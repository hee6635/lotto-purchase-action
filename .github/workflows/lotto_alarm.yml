name: 로또 예약 사전 알람
on:
  schedule:
    - cron: '50 7 * * 1' # 매주 월요일 한국시간 오후 4시 50분 (UTC 07:50)
  workflow_dispatch: # 테스트용 수동 실행 버튼

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Send Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 💡 05번 알람 스크립트 실행
          node -e "
          import('./custom-workflows/05-notify-prepurchase.js').then(m => m.default());
          "
