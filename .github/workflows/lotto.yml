name: 로또 마스터 시스템 (월요구매 & 토요당첨알림)

on:
  schedule:
    - cron: '0 22 * * 0' # [1차] 월요일 오전 07:00 (구매 및 충전예약)
    - cron: '0 10 * * 1' # [2차] 월요일 오후 19:00 (잔액 파수꾼)
    - cron: '15 12 * * 6' # [3차] 토요일 오후 21:15 (당첨 결과 번개 보고)
  workflow_dispatch:
    inputs:
      command_data:
        description: '실행 모드 (PURCHASE_AUTO, CHECK_BALANCE, CHECK_WIN)'
        required: true
        default: 'PURCHASE_AUTO'

permissions:
  contents: write

jobs:
  lotto_job:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.55.1-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install
        run: npm ci
      - name: Run Bot
        uses: ./
        env:
          INPUT_COMMAND: ${{ github.event.inputs.command_data || (github.event.schedule == '0 22 * * 0' && 'PURCHASE_AUTO' || (github.event.schedule == '0 10 * * 1' && 'CHECK_BALANCE' || 'CHECK_WIN')) }}
          INPUT_ACCOUNT_MODE: 'both'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          dhlottery-id: ${{ secrets.DHLOTTERY_ID }}
          dhlottery-password: ${{ secrets.DHLOTTERY_PASSWORD }}
          github-token: ${{ github.token }}
          workflow-file: custom-workflows/02-manual-fixed-numbers.js
