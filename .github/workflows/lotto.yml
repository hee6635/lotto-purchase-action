name: 로또 구매 (수동 + 스케줄)
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      command_data:
        description: '명령 종류'
        required: false
        default: 'buy_now'
      lotto_numbers:
        description: '구매할 번호'
        required: false
        default: ''
      date_range:
        description: '조회 기간 (YYYYMMDD_YYYYMMDD)'
        required: false
        default: ''
      account_mode:
        description: '계정 모드 (acc1 또는 acc2)'
        required: false
        default: 'acc1'

permissions:
  contents: write
  issues: write

jobs:
  purchase:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.55.1-jammy
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Custom purchase workflow
        uses: ./
        env:
          INPUT_LOTTO_NUMBERS: ${{ github.event.inputs.lotto_numbers }}
          INPUT_DATE_RANGE: ${{ github.event.inputs.date_range }}
          INPUT_ACCOUNT_MODE: ${{ github.event.inputs.account_mode }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          # 💡 [해결] 여기서 확실하게 스위칭! acc2면 ID_2를, 아니면 기본 ID를 줍니다.
          dhlottery-id: ${{ github.event.inputs.account_mode == 'acc2' && secrets.DHLOTTERY_ID_2 || secrets.DHLOTTERY_ID }}
          dhlottery-password: ${{ github.event.inputs.account_mode == 'acc2' && secrets.DHLOTTERY_PASSWORD_2 || secrets.DHLOTTERY_PASSWORD }}
          github-token: ${{ github.token }}
          workflow-file: custom-workflows/02-manual-fixed-numbers.js

      - name: Save and Push Result
        run: |
          git config --global --add safe.directory /__w/lotto-purchase-action/lotto-purchase-action
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          if [ -f "result.json" ]; then
            git add result.json
            git commit -m "Update result.json" || echo "No changes to commit"
            git pull --rebase origin main
            git push origin main
          else
            echo "결과 파일이 생성되지 않았습니다."
          fi
