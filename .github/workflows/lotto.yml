name: 로또 구매 (수동 + 스케줄 + 잔액 점검)

on:
  schedule:
    - cron: '0 8 * * 1' # 매주 월요일 한국시간 오후 5시 (예약 구매)
    - cron: '0 9 * * 3' # 매주 수요일 한국시간 오후 6시 (잔액 파수꾼 점검)
  workflow_dispatch:
    inputs:
      account_mode:
        description: '실행할 계정을 선택하세요 (acc1, acc2, both)'
        required: true
        default: 'acc1'
        type: choice
        options:
          - acc1
          - acc2
          - both
      lotto_numbers:
        description: '구매할 번호 (예약 시 RESERVE_SET|... 형식)'
        required: false
        default: 'SYNC_ONLY'
      date_range:
        description: '조회 기간 (YYYYMMDD_YYYYMMDD)'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

jobs:
  lotto_job:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.55.1-jammy
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      # ─── [1] 수동 실행 단계 (앱/웹에서 버튼 클릭 시) ───
      - name: Manual Execution
        if: github.event_name == 'workflow_dispatch'
        uses: ./
        env:
          INPUT_ACCOUNT_MODE: ${{ github.event.inputs.account_mode }}
          INPUT_LOTTO_NUMBERS: ${{ github.event.inputs.lotto_numbers }}
          INPUT_DATE_RANGE: ${{ github.event.inputs.date_range }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IS_SCHEDULED: 'false'
        with:
          # 계정 선택에 따라 Secret 값을 동적으로 할당
          dhlottery-id: ${{ github.event.inputs.account_mode == 'acc2' && secrets.DHLOTTERY_ID_2 || secrets.DHLOTTERY_ID }}
          dhlottery-password: ${{ github.event.inputs.account_mode == 'acc2' && secrets.DHLOTTERY_PASSWORD_2 || secrets.DHLOTTERY_PASSWORD }}
          github-token: ${{ github.token }}
          workflow-file: custom-workflows/02-manual-fixed-numbers.js

      # ─── [2] 월요일 오후 5시 예약 자동 실행 (계정 1) ───
      - name: Scheduled Purchase (Acc 1)
        if: github.event_name == 'schedule' && github.event.schedule == '0 8 * * 1'
        uses: ./
        env:
          INPUT_ACCOUNT_MODE: 'acc1'
          IS_SCHEDULED: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          dhlottery-id: ${{ secrets.DHLOTTERY_ID }}
          dhlottery-password: ${{ secrets.DHLOTTERY_PASSWORD }}
          github-token: ${{ github.token }}
          workflow-file: custom-workflows/02-manual-fixed-numbers.js

      # ─── [3] 월요일 오후 5시 예약 자동 실행 (계정 2) ───
      - name: Scheduled Purchase (Acc 2)
        if: github.event_name == 'schedule' && github.event.schedule == '0 8 * * 1'
        uses: ./
        env:
          INPUT_ACCOUNT_MODE: 'acc2'
          IS_SCHEDULED: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          dhlottery-id: ${{ secrets.DHLOTTERY_ID_2 }}
          dhlottery-password: ${{ secrets.DHLOTTERY_PASSWORD_2 }}
          github-token: ${{ github.token }}
          workflow-file: custom-workflows/02-manual-fixed-numbers.js

      # ─── [4] 수요일 오후 6시 잔액 파수꾼 실행 ───
      - name: Wednesday Health Check
        if: github.event_name == 'schedule' && github.event.schedule == '0 9 * * 3'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node -e "import('./custom-workflows/06-balance-health-check.js').then(m => m.default());"

      # ─── [5] 결과 저장 및 깃허브 반영 (Push) ───
      - name: Save and Push Result
        if: always() # 실패하더라도 장부는 최대한 저장
        run: |
          git config --global --add safe.directory /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          if [ -f "result.json" ]; then
            git add result.json
            git commit -m "🤖 장부 자동 업데이트 (결과/예약)" || echo "변경 사항 없음"
            git pull --rebase origin main
            git push origin main
          fi
