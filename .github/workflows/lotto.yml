name: 로또 구매 (수동 + 스케줄)
on:
  schedule:
    # 매주 일요일 한국 시간 12:00 (UTC 03:00)
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      command_data:
        description: '명령 종류 (buy_now)'
        required: false
        default: 'buy_now'
      lotto_numbers:
        description: '구매할 번호 (예: 1,2,3,4,5,6)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  purchase:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.55.1-jammy
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm ci

      - name: Custom purchase workflow
        uses: ./
        with:
          dhlottery-id: ${{ secrets.DHLOTTERY_ID }}
          dhlottery-password: ${{ secrets.DHLOTTERY_PASSWORD }}
          github-token: ${{ github.token }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 💡 [수정 1] 자동 대신 '수동 고정 번호' 스크립트를 사용합니다.
          workflow-file: custom-workflows/02-manual-fixed-numbers.js
          # 💡 [수정 2] 어플에서 보낸 번호를 로봇 스크립트에게 직접 전달합니다.
          lotto-numbers: ${{ github.event.inputs.lotto_numbers }}
