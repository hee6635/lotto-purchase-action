name: 로또 구매 (수동 + 스케줄)
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      command_data:
        description: '명령 종류'
        required: false
        default: 'buy_now'
      lotto_numbers:
        description: '구매할 번호'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

jobs:
  purchase:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.55.1-jammy
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm ci

      - name: Custom purchase workflow
        uses: ./
        with:
          dhlottery-id: ${{ secrets.DHLOTTERY_ID }}
          dhlottery-password: ${{ secrets.DHLOTTERY_PASSWORD }}
          github-token: ${{ github.token }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          workflow-file: custom-workflows/02-manual-fixed-numbers.js
          lotto-numbers: ${{ github.event.inputs.lotto_numbers }}

      # 💡 [최종 수정] 결과 저장 단계
      - name: Save and Push Result
        run: |
          # 보안 예외 처리
          git config --global --add safe.directory /__w/lotto-purchase-action/lotto-purchase-action
          
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 로봇이 생성한 result.json이 있는지 확인하고 저장
          if [ -f "result.json" ]; then
            git add result.json
            git commit -m "Update real balance from dhlottery" || echo "No changes to commit"
            git push
          else
            echo "결과 파일(result.json)이 생성되지 않았습니다."
          fi
