name: 로또 구매 (수동 + 스케줄)
on:
  schedule:
    - cron: '0 3 * * 0' # 매주 일요일 한국시간 12:00
  workflow_dispatch:
    inputs:
      command_data:
        description: '명령 종류 (buy_now)'
        required: false
        default: 'buy_now'
      lotto_numbers: # 👈 [신규] 어플에서 보낸 번호를 담는 그릇
        description: '구매할 번호 (예: 1,2,3,4,5,6)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  purchase:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.55.1-jammy
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm ci

      - name: Custom purchase workflow
        uses: ./
        with:
          dhlottery-id: ${{ secrets.DHLOTTERY_ID }}
          dhlottery-password: ${{ secrets.DHLOTTERY_PASSWORD }}
          github-token: ${{ github.token }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 💡 번호 일치를 위해 필요시 '수동 전용' 스크립트로 경로를 바꿀 수 있습니다.
          workflow-file: custom-workflows/01-auto-basic.js
          # 아래는 어플에서 보낸 번호를 환경변수로 넘겨주는 설정 (선택 사항)
          # lotto-numbers: ${{ github.event.inputs.lotto_numbers }} 
