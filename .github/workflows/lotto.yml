name: 로또 구매 (수동 + 스케줄)
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      command_data:
        description: '명령 종류'
        required: false
        default: 'buy_now'
      lotto_numbers:
        description: '구매할 번호'
        required: false
        default: ''

# 💡 [중요] 로봇이 저장소에 파일을 쓸 수 있도록 권한을 'write'로 바꿉니다.
permissions:
  contents: write
  issues: write

jobs:
  purchase:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.55.1-jammy
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm ci

      - name: Custom purchase workflow
        uses: ./
        with:
          dhlottery-id: ${{ secrets.DHLOTTERY_ID }}
          dhlottery-password: ${{ secrets.DHLOTTERY_PASSWORD }}
          github-token: ${{ github.token }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          workflow-file: custom-workflows/02-manual-fixed-numbers.js
          lotto-numbers: ${{ github.event.inputs.lotto_numbers }}

      # 💡 [신규 추가] 구매 결과를 result.json 파일로 저장하고 푸시하는 단계
      - name: Save and Push Result
        run: |
          # 현재 시간을 포함한 잔액 정보 생성 (임시 데이터)
          # 실제 구매 엔진이 생성한 결과 파일이 있다면 그 파일을 쓰면 되지만, 
          # 우선 동기화 테스트를 위해 파일을 강제로 생성하는 로직을 넣습니다.
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 만약 엔진이 파일을 안 만들었다면 여기서 기본값이라도 생성
          if [ ! -f "result.json" ]; then
            echo '{"balance": 0, "message": "구매 완료"}' > result.json
          fi
          
          git add result.json
          git commit -m "Update purchase result" || echo "No changes to commit"
          git push
