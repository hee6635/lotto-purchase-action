name: 로또 구매 (수동 + 스케줄)
on:
  schedule:
    - cron: '0 8 * * 1' # 매주 월요일 한국시간 오후 5시 (UTC 오전 8시)
  workflow_dispatch:
    inputs:
      command_data:
        description: '명령 종류'
        required: false
        default: 'buy_now'
      lotto_numbers:
        description: '구매할 번호'
        required: false
        default: ''
      date_range:
        description: '조회 기간 (YYYYMMDD_YYYYMMDD)'
        required: false
        default: ''
      account_mode:
        description: '계정 모드 (acc1 또는 acc2)'
        required: false
        default: 'acc1'

permissions:
  contents: write
  issues: write

jobs:
  purchase:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.55.1-jammy
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      # ─── 수동 실행 (앱에서 즉시 구입/동기화 눌렀을 때) ───
      - name: Purchase (Manual)
        if: github.event_name == 'workflow_dispatch'
        uses: ./
        env:
          INPUT_LOTTO_NUMBERS: ${{ github.event.inputs.lotto_numbers }}
          INPUT_DATE_RANGE: ${{ github.event.inputs.date_range }}
          INPUT_ACCOUNT_MODE: ${{ github.event.inputs.account_mode }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IS_SCHEDULED: 'false'
        with:
          dhlottery-id: ${{ github.event.inputs.account_mode == 'acc2' && secrets.DHLOTTERY_ID_2 || secrets.DHLOTTERY_ID }}
          dhlottery-password: ${{ github.event.inputs.account_mode == 'acc2' && secrets.DHLOTTERY_PASSWORD_2 || secrets.DHLOTTERY_PASSWORD }}
          github-token: ${{ github.token }}
          workflow-file: custom-workflows/02-manual-fixed-numbers.js

      # ─── 월요일 오후 5시 예약 자동 실행 (계정 1) ───
      - name: Scheduled Purchase (Acc 1)
        if: github.event_name == 'schedule'
        uses: ./
        env:
          INPUT_ACCOUNT_MODE: 'acc1'
          IS_SCHEDULED: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          dhlottery-id: ${{ secrets.DHLOTTERY_ID }}
          dhlottery-password: ${{ secrets.DHLOTTERY_PASSWORD }}
          github-token: ${{ github.token }}
          workflow-file: custom-workflows/02-manual-fixed-numbers.js

      # ─── 월요일 오후 5시 예약 자동 실행 (계정 2) ───
      - name: Scheduled Purchase (Acc 2)
        if: github.event_name == 'schedule'
        uses: ./
        env:
          INPUT_ACCOUNT_MODE: 'acc2'
          IS_SCHEDULED: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          dhlottery-id: ${{ secrets.DHLOTTERY_ID_2 }}
          dhlottery-password: ${{ secrets.DHLOTTERY_PASSWORD_2 }}
          github-token: ${{ github.token }}
          workflow-file: custom-workflows/02-manual-fixed-numbers.js

      # ─── 장부 갱신 및 저장 ───
      - name: Save and Push Result
        run: |
          git config --global --add safe.directory /__w/lotto-purchase-action/lotto-purchase-action
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          if [ -f "result.json" ]; then
            git add result.json
            git commit -m "Auto Update: Result and Reservation" || echo "No changes to commit"
            git pull --rebase origin main
            git push origin main
          else
            echo "결과 파일이 생성되지 않았습니다."
          fi
