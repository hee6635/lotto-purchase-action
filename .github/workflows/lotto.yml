name: 로또 마스터 시스템 (오전충전/오후구매 & 토요당첨알림)

on:
  schedule:
    - cron: '0 22 * * 0'  # [1차] 월요일 오전 07:00 KST (충전 신청)
    - cron: '0 9 * * 1'   # [2차] 월요일 오후 18:00 KST (실제 구매)
    - cron: '15 12 * * 6' # [3차] 토요일 오후 21:15 KST (당첨 번개 보고)
  workflow_dispatch:
    inputs:
      lotto_numbers:
        description: '로또 번호 또는 명령 (SYNC_ONLY)'
        required: false
        default: 'SYNC_ONLY'
      account_mode:
        description: '계정 모드 (acc1, acc2, both)'
        required: false
        default: 'both'
      date_range:
        description: '조회 기간 (YYYYMMDD_YYYYMMDD)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  lotto_job:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.55.1-jammy
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      # 💡 [보강] 깃허브 cron 스케줄 문동을 더 확실하게 캐치하도록 보정
      - name: 스케줄에 따른 명령어 세팅
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "COMMAND=MANUAL" >> $GITHUB_ENV
          elif [[ "${{ github.event.schedule }}" == *"0 22"* ]]; then
            echo "COMMAND=RECHARGE_ONLY" >> $GITHUB_ENV
          elif [[ "${{ github.event.schedule }}" == *"0 9"* ]]; then
            echo "COMMAND=PURCHASE_AUTO" >> $GITHUB_ENV
          elif [[ "${{ github.event.schedule }}" == *"15 12"* ]]; then
            echo "COMMAND=CHECK_WIN" >> $GITHUB_ENV
          else
            echo "COMMAND=MANUAL" >> $GITHUB_ENV
          fi

      # ─── [1] 계정 1 실행 단계 ───
      - name: Run Bot (Acc 1)
        if: |
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.account_mode == 'acc1' || github.event.inputs.account_mode == 'both')) ||
          (github.event_name == 'schedule')
        uses: ./
        env:
          INPUT_ACCOUNT_MODE: 'acc1'
          INPUT_LOTTO_NUMBERS: ${{ github.event.inputs.lotto_numbers }}
          INPUT_DATE_RANGE: ${{ github.event.inputs.date_range }}
          INPUT_COMMAND: ${{ env.COMMAND }}
          IS_SCHEDULED: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          dhlottery-id: ${{ secrets.DHLOTTERY_ID }}
          dhlottery-password: ${{ secrets.DHLOTTERY_PASSWORD }}
          github-token: ${{ github.token }}
          workflow-file: custom-workflows/02-manual-fixed-numbers.js

      # ─── [2] 계정 2 실행 단계 ───
      - name: Run Bot (Acc 2)
        if: |
          (github.event_name == 'workflow_dispatch' && (github.event.inputs.account_mode == 'acc2' || github.event.inputs.account_mode == 'both')) ||
          (github.event_name == 'schedule')
        uses: ./
        env:
          INPUT_ACCOUNT_MODE: 'acc2'
          INPUT_LOTTO_NUMBERS: ${{ github.event.inputs.lotto_numbers }}
          INPUT_DATE_RANGE: ${{ github.event.inputs.date_range }}
          INPUT_COMMAND: ${{ env.COMMAND }}
          IS_SCHEDULED: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          dhlottery-id: ${{ secrets.DHLOTTERY_ID_2 }}
          dhlottery-password: ${{ secrets.DHLOTTERY_PASSWORD_2 }}
          github-token: ${{ github.token }}
          workflow-file: custom-workflows/02-manual-fixed-numbers.js

      # ─── [3] 안전한 결과 장부 저장 ───
      - name: Save Result
        if: always()
        run: |
          git config --global --add safe.directory /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          if [ -f "result.json" ]; then
            git add result.json
            git commit -m "🤖 로또 장부 업데이트" || echo "변경사항 없음"
            git pull --rebase -X theirs origin main
            git push origin main
          fi
