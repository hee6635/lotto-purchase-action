name: 로또 잔액 파수꾼 (수요일 점검)
on:
  schedule:
    - cron: '0 9 * * 3' # 매주 수요일 한국시간 오후 6시 (UTC 09:00)
  workflow_dispatch: # 테스트용 버튼

jobs:
  check_balance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Balance Check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_ACCOUNT_MODE: "both" 
          INPUT_LOTTO_NUMBERS: "SYNC_ONLY"
        run: |
          node -e "
          import('./custom-workflows/06-balance-health-check.js').then(m => m.default());
          "
